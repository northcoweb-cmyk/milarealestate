name: Deliver reminders
# Vercel's free plan only runs scheduled jobs once a day, so this wakes the reminder delivery every 5 minutes (GitHub may delay a run by a few minutes).
# One-time setup: repo Settings -> Secrets and variables -> Actions -> New repository secret named CRON_SECRET with the same value as CRON_SECRET in the Mila app's Vercel settings.
# Until that secret exists the job does nothing (and never fails), and reminders are delivered whenever the app is open.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliver due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in GitHub secrets: skipping"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "https://app.milarealestate.app/api/cron/reminders?fast=1" || echo "reminder ping did not succeed"
